name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + API tests)
    runs-on: ubuntu-latest
    # The API tests run the real app against PostgreSQL. CI=true makes them fail
    # instead of skip if the database is unreachable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trafonsjakk
          POSTGRES_USER: trafonsjakk
          POSTGRES_PASSWORD: trafonsjakk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trafonsjakk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
