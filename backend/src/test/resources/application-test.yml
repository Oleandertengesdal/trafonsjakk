# Integration-test profile. Uses its own schema inside the local dev database (docker compose),
# so tests never touch your dev data and need no extra setup. CI runs a PostgreSQL service with the same credentials.
spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/trafonsjakk?currentSchema=trafonsjakk_test}
    username: ${TEST_DATABASE_USERNAME:trafonsjakk}
    password: ${TEST_DATABASE_PASSWORD:trafonsjakk}
  flyway:
    schemas: trafonsjakk_test
    default-schema: trafonsjakk_test
  jpa:
    properties:
      hibernate:
        default_schema: trafonsjakk_test

app:
  jwt:
    secret: test-only-jwt-secret-not-used-anywhere-else-0123456789
  cookies:
    secure: false
  bootstrap-invite-code: test-bootstrap-code
  games:
    # The suite logs games from earlier months and years as ordinary members.
    # BackdateLimitApiTest runs with the real limit.
    max-backdate: 36500d
  security:
    # Tests register many users from 127.0.0.1; per-user lockout stays at the real value.
    max-failed-logins-per-ip: 10000
    max-registrations-per-ip-per-hour: 10000
    max-failed-logins-per-edge: 10000
    max-registrations-per-edge-per-hour: 10000

logging:
  level:
    root: WARN
    no.trafonsjakk: WARN
